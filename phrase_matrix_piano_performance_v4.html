<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Piano Performance v4</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100svh;background:#07090d;color:#eef3f6;font-family:system-ui;display:grid;place-items:center;padding:18px;touch-action:manipulation}.m{width:min(920px,100%);background:#0d1218;border:1px solid #303a45;border-radius:24px;padding:20px;box-shadow:0 25px 80px #000}.k{font-size:11px;letter-spacing:.22em;color:#82909d}.t{font-size:clamp(22px,5vw,36px);font-weight:900;margin:4px 0 18px}.g{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.p{min-height:180px;position:relative;border:1px solid #394653;border-radius:18px;background:#121820;color:#fff;overflow:hidden}.p:before{content:"";position:absolute;inset:0;background:radial-gradient(circle,var(--c),transparent 68%);opacity:0;transition:.14s}.p.on{border-color:var(--c);box-shadow:0 0 25px color-mix(in srgb,var(--c) 40%,transparent)}.p.on:before{opacity:.25}.p.hit:before{opacity:.9;transition:none}.name{position:absolute;left:15px;bottom:38px;font-size:24px;font-weight:900}.sub{position:absolute;left:15px;bottom:16px;font-size:10px;letter-spacing:.12em;color:#96a2ad}.c{display:flex;gap:10px;margin-top:14px}.c button,#init{border:1px solid #3a4651;background:#121820;color:#fff;border-radius:12px;padding:12px 15px;font-weight:800}.s{margin-top:12px;color:#7f8b96;font-size:11px}.ov{position:fixed;inset:0;background:#05070af2;display:grid;place-items:center;padding:24px;z-index:5}.box{max-width:420px;text-align:center}.box p{color:#909ca6;line-height:1.6}.box #init{width:100%;padding:17px;border-color:#b6f2ff}.hide{display:none}@media(min-width:760px){.g{grid-template-columns:repeat(4,1fr)}.p{min-height:250px}}
</style>
<div class="m"><div class="k">PHRASE MATRIX / GESTURE LAB</div><div class="t">PIANO PERFORMANCE ENGINE v4</div><div class="g" id="g"></div><div class="c"><button id="stop">STOP ALL</button></div><div class="s" id="s">CHORD · ROLL · RUN · STAB · OCTAVE · SLAM / BPM 132</div></div>
<div class="ov" id="ov"><div class="box"><h1>Hands on the keys.</h1><p>今回は「ポロポロ禁止」。両手で鍵盤をかき鳴らす演奏ジェスチャーだけを検証します。ヘッドホン推奨。</p><button id="init">INITIALIZE AUDIO</button></div></div>
<script>
let A,M,C,V,VG,D,DG,nx=0,st=0,timer;const bpm=132,dt=60/bpm/4,on=new Set(),els={};const H=m=>440*2**((m-69)/12);
function imp(){let b=A.createBuffer(2,A.sampleRate*1.2,A.sampleRate);for(let c=0;c<2;c++){let x=b.getChannelData(c);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length)**3}return b}
async function init(){A=new(AudioContext||webkitAudioContext)();M=A.createGain();M.gain.value=.62;C=A.createDynamicsCompressor();C.threshold.value=-13;C.ratio.value=5;C.attack.value=.005;C.release.value=.16;V=A.createConvolver();V.buffer=imp();VG=A.createGain();VG.gain.value=.07;D=A.createDelay(1);D.delayTime.value=.205;DG=A.createGain();DG.gain.value=.07;M.connect(C);C.connect(A.destination);M.connect(V);V.connect(VG);VG.connect(C);M.connect(D);D.connect(DG);DG.connect(C);await A.resume();nx=A.currentTime+.08;sched();ov.classList.add('hide')}
function key(m,t,d=.2,v=.2){let o=A.createOscillator(),o2=A.createOscillator(),g=A.createGain(),g2=A.createGain(),f=A.createBiquadFilter();o.type='sine';o2.type='triangle';o.frequency.value=H(m);o2.frequency.value=H(m)*2;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+d);g2.gain.setValueAtTime(v*.075,t);g2.gain.exponentialRampToValueAtTime(.0001,t+.07);f.type='lowpass';f.frequency.value=6200;o.connect(g);o2.connect(g2);g.connect(f);g2.connect(f);f.connect(M);o.start(t);o2.start(t);o.stop(t+d+.03);o2.stop(t+d+.03)}
function chord(a,t,d=.18,v=.18,sp=.011){a.forEach((m,i)=>key(m,t+i*sp,d,v*(1-i*.03)))}
function oct(m,t){key(m,t,.17,.25);key(m+12,t+.007,.17,.17)}
function run(a,t,g=.045){a.forEach((m,i)=>key(m,t+i*g,.14,.18+i*.006))}
function kick(t){let o=A.createOscillator(),g=A.createGain();o.frequency.setValueAtTime(100,t);o.frequency.exponentialRampToValueAtTime(48,t+.07);g.gain.setValueAtTime(.28,t);g.gain.exponentialRampToValueAtTime(.0001,t+.13);o.connect(g);g.connect(M);o.start(t);o.stop(t+.15)}
function hit(id){let e=els[id];setTimeout(()=>{e.classList.add('hit');setTimeout(()=>e.classList.remove('hit'),85)},0)}
const P=[
{id:'d',n:'DRIVE',sub:'OCTAVE × STAB',c:'#a95cff',f:(s,t)=>{if([0,6,8,14].includes(s)){oct(s<8?48:43,t);chord(s<8?[60,64,67,71]:[55,59,62,69],t+.016);hit('d')}if([3,11].includes(s))chord([62,65,69,72],t,.12,.15);if([0,4,8,12].includes(s))kick(t)}},
{id:'r',n:'RUSH',sub:'RUN × SLAM',c:'#52e6a5',f:(s,t)=>{if(s===0){chord([53,57,60,64],t,.22,.19);hit('r')}if(s===4)run([67,69,71,72,76],t);if(s===8){chord([55,59,62,69],t,.2,.2);hit('r')}if(s===12)run([76,74,71,69,67,64],t,.04);if(s===15)chord([60,64,67,69,74],t,.28,.2)}},
{id:'b',n:'BOUNCE',sub:'ROLL × OFFBEAT',c:'#ffd84a',f:(s,t)=>{if([2,7,10,15].includes(s)){chord(s<8?[57,60,64,67]:[55,59,62,69],t,.14,.18,.023);hit('b')}if([0,8].includes(s))oct(s?43:41,t)}},
{id:'a',n:'ANTHEM',sub:'BOTH HANDS / FULL',c:'#ff596d',f:(s,t)=>{if(s===0){oct(48,t);chord([60,64,67,71,74],t+.012,.24,.19);hit('a')}if(s===3)run([64,67,69,71],t);if(s===6)chord([53,57,60,64,67],t,.15,.19);if(s===8){oct(43,t);chord([67,71,74,81],t+.012,.2,.19);hit('a')}if(s===11)run([69,71,72,76,79],t,.04);if(s===14)chord([65,69,72,76],t,.12,.19);if(s===15)chord([60,64,67,69,74],t+.02,.3,.22);if([0,4,8,12].includes(s))kick(t)}}
];
function sched(){while(nx<A.currentTime+.12){for(const p of P)if(on.has(p.id))p.f(st,nx);nx+=dt;st=(st+1)%16}timer=setTimeout(sched,25)}
const g=document.getElementById('g');P.forEach(p=>{let e=document.createElement('button');e.className='p';e.style.setProperty('--c',p.c);e.innerHTML='<span class="name">'+p.n+'</span><span class="sub">'+p.sub+'</span>';e.onpointerdown=async x=>{x.preventDefault();if(A.state!=='running')await A.resume();on.has(p.id)?(on.delete(p.id),e.classList.remove('on')):(on.add(p.id),e.classList.add('on'))};g.appendChild(e);els[p.id]=e});
document.getElementById('init').onclick=init;document.getElementById('stop').onclick=()=>{on.clear();Object.values(els).forEach(e=>e.classList.remove('on'))};
</script>
