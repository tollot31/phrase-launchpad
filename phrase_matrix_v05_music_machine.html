function chooseRole(role,exclude){const a=phrases.filter(p=>p.role===role&&p.id!==exclude);return a[Math.floor(Math.random()*a.length)].id}
function autoSeed(){pending.clear();active.clear();for(const r of ['H','A','G','C'])active.add(chooseRole(r));autoCycle=0;renderState();document.getElementById('status').textContent='AUTO // SESSION START'}
function autoAdvance(){autoCycle++;if(autoCycle%2!==0)return;const roles=['H','A','G','C'],r=roles[Math.floor(Math.random()*roles.length)],old=[...active].find(id=>phrases.find(p=>p.id===id).role===r),nu=chooseRole(r,old);if(old)active.delete(old);active.add(nu);renderState();document.getElementById('status').textContent='AUTO // '+r+' SHIFT'}
function toggleAuto(){autoMode=!autoMode;const b=document.getElementById('autoBtn');b.classList.toggle('on',autoMode);b.textContent=autoMode?'AUTO ON':'AUTO';if(autoMode)autoSeed();else document.getElementById('status').textContent='AUTO // OFF · MANUAL READY'}
function toggleLight(){lightMode=lightMode==='VIVID'?'CHILL':'VIVID';document.body.classList.toggle('chill',lightMode==='CHILL');document.getElementById('lightBtn').textContent=lightMode;document.getElementById('status').textContent='LIGHT // '+lightMode}
function toggle(id){if(autoMode){autoMode=false;document.getElementById('autoBtn').classList.remove('on');document.getElementById('autoBtn').textContent='AUTO'}if(ctx&&(ctx.state==='suspended'||ctx.state==='interrupted'))ctx.resume();const on=active.has(id),q=pending.get(id),target=q!==undefined?!q:!on;const projected=[...active].filter(x=>pending.get(x)!==false).length+[...pending].filter(([x,v])=>v&&!active.has(x)).length;if(target&&!on&&projected>=4){document.getElementById('status').textContent='LIMIT // MAX 4 PHRASES';return}pending.set(id,target);pads.get(id).classList.add('armed');document.getElementById('status').textContent=target?'ARMED // NEXT BAR':'STOP ARMED // NEXT BAR'}
function renderState(){for(const[id,e]of pads){e.classList.toggle('live',active.has(id));e.classList.remove('armed')}document.getElementById('activeCount').textContent=active.size;document.getElementById('status').textContent=active.size?'ENGINE // PLAYING':'ENGINE // READY'}
function buildGrid(){const grid=document.getElementById('grid'),arr=[...phrases];for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}for(const ph of arr){const b=document.createElement('button');b.className='pad';b.type='button';b.style.setProperty('--c',COLORS[ph.role]);b.innerHTML='<span class="dot"></span>';b.setAttribute('aria-label','phrase pad');b.addEventListener('pointerdown',e=>{e.preventDefault();toggle(ph.id)});grid.appendChild(b);pads.set(ph.id,b)}}
document.getElementById('autoBtn').addEventListener('pointerdown',e=>{e.preventDefault();toggleAuto()});document.getElementById('lightBtn').addEventListener('pointerdown',e=>{e.preventDefault();toggleLight()});document.getElementById('tempo').addEventListener('change',e=>{bpm=+e.target.value;document.getElementById('status').textContent='TEMPO // '+bpm+' BPM'});document.addEventListener('pointerdown',()=>{if(ctx&&(ctx.state==='suspended'||ctx.state==='interrupted')){ctx.resume().then(()=>{nextStep=Math.max(nextStep,ac()+.05);scheduler()})}},{passive:true});document.getElementById('initBtn').addEventListener('click',async()=>{setup();await ctx.resume();document.getElementById('overlay').style.display='none';buildGrid();nextStep=ac()+.08;step=0;scheduler();document.getElementById('status').textContent='ENGINE // READY'});
})();</script></body></html>
