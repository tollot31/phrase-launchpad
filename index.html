<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070a0f">
<title>Phrase Matrix v0.2.1</title>
<style>
:root{--bg:#06080c;--panel:#0c1118;--line:#1d2732;--text:#dce7f1;--muted:#65717d;--cyan:#55eaff;--violet:#a879ff;--pink:#ff5ccf;--amber:#ffc36a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;background:radial-gradient(circle at 50% 35%,#111927 0,#080c12 38%,#040609 100%);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:12px;padding:14px;max-width:1100px;margin:auto}
header,footer{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:34px}.brand{letter-spacing:.22em;font-size:12px;color:#9fb0bf}.brand b{color:#eef8ff;font-weight:600}.readout{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.chip{border:1px solid #27323d;background:#0a0f15cc;border-radius:999px;padding:7px 10px;font-size:10px;letter-spacing:.08em;color:#8795a3}.chip strong{color:#e9f7ff;font-weight:600}.tempo{appearance:none;border:1px solid #33414e;background:#0a1017;color:#dff8ff;border-radius:8px;padding:7px 9px;font:inherit;font-size:11px}
.stage{min-height:0;display:grid;place-items:center}.grid{width:min(88vw,72vh,760px);aspect-ratio:1;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);gap:clamp(6px,1.1vw,12px);padding:clamp(8px,1.2vw,14px);border:1px solid #26313c;background:linear-gradient(145deg,#0c1117,#070a0f);border-radius:20px;box-shadow:0 25px 80px #000a,inset 0 0 40px #17233155}
.pad{position:relative;border:1px solid #26323d;border-radius:13px;background:linear-gradient(145deg,#151c24,#090d12 62%);box-shadow:inset 0 1px 0 #ffffff0b,0 5px 12px #0008;overflow:hidden;transition:transform .08s ease,border-color .15s ease,box-shadow .15s ease}.pad:active{transform:scale(.96)}.pad::before{content:"";position:absolute;inset:8%;border-radius:9px;background:radial-gradient(circle at 50% 42%,var(--c,#4a5a68) 0,transparent 66%);opacity:0;filter:blur(4px);transition:opacity .12s}.pad.live{border-color:color-mix(in srgb,var(--c) 62%,#31404c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 28%,transparent),inset 0 0 18px color-mix(in srgb,var(--c) 12%,transparent)}.pad.live::before{opacity:.18}.pad.flash::before{opacity:.9}.pad.armed{border-color:#d6f6ff;box-shadow:0 0 0 1px #d6f6ff66,0 0 16px #8befff33}.pad.dummy{opacity:.35}.pad.dummy:active{transform:none}.tag{position:absolute;left:8px;bottom:7px;font-size:7px;letter-spacing:.11em;color:#71808e;opacity:.72}.pad.live .tag{color:#c8d5df}.dot{position:absolute;right:8px;top:8px;width:4px;height:4px;border-radius:50%;background:#4b5966}.pad.live .dot{background:var(--c);box-shadow:0 0 7px var(--c)}
footer{font-size:9px;color:#596673;letter-spacing:.08em}.status{white-space:nowrap}.hint{text-align:right}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#04070bed;backdrop-filter:blur(10px);z-index:20}.init{width:min(82vw,390px);padding:28px 24px;border:1px solid #31404c;border-radius:18px;background:linear-gradient(145deg,#111822,#080c12);box-shadow:0 30px 90px #000}.init h1{font-size:17px;letter-spacing:.16em;margin:0 0 10px}.init p{font-size:11px;line-height:1.7;color:#8493a0;margin:0 0 20px}.init button{width:100%;padding:15px;border:1px solid #6cecff;background:#0b1720;color:#dffbff;border-radius:10px;font:inherit;letter-spacing:.18em}.hidden{display:none!important}
@media (orientation:landscape) and (min-width:700px){#app{grid-template-columns:160px 1fr 160px;grid-template-rows:1fr;padding:20px;align-items:center}header,footer{height:min(76vh,760px);flex-direction:column;justify-content:center}.readout{flex-direction:column}.stage{grid-column:2}.grid{width:min(76vh,66vw,760px)}footer{font-size:9px;text-align:center}.hint{text-align:center;line-height:1.6}.brand{writing-mode:vertical-rl;transform:rotate(180deg)}}
</style></head>
<body>
<div id="app"><header><div class="brand"><b>PHRASE</b> / MATRIX <span style="color:#53606c">v0.2.1</span></div><div class="readout"><div class="chip">ACTIVE <strong id="activeCount">0</strong>/4</div><div class="chip">BAR <strong id="bar">—</strong></div><select id="tempo" class="tempo" aria-label="tempo"><option value="72">72 BPM</option><option value="144">144 BPM</option></select></div></header><main class="stage"><div id="grid" class="grid"></div></main><footer><div class="status" id="status">ENGINE // STANDBY</div><div class="hint">TAP = ARM / STOP · BAR QUANTIZED<br>12 PHRASES ACTIVE / 24 SILENT CELLS</div></footer></div>
<div id="overlay" class="overlay"><div class="init"><h1>PHRASE / MATRIX</h1><p>12-phrase interaction prototype · Piano Engine v2.<br>FLOW · TENSION · SYNC · ECHO<br><br>Headphones recommended. Audio starts only after your touch.</p><button id="initBtn">INITIALIZE AUDIO</button></div></div>
<script>
(()=>{'use strict';
const STEPS=64,SPB=16; let ctx,master,delay,delayFb,reverb,noiseBuffer,timer=null,nextStep=0,step=0,bar=0,bpm=72; const active=new Set(),pending=new Map(),pads=new Map();
const C={FLOW:'#55eaff',TENSION:'#ff5ccf',SYNC:'#a879ff',ECHO:'#ffc36a'};
const N={D3:146.83,E3:164.81,F3:174.61,G3:196,A3:220,C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880};
const phrases=[
{id:'F-A',m:'FLOW',v:'PURE',p:1,r:0,b:0,s:1,ev:[[0,'D4',.72],[4,'F4',.55],[8,'A4',.62],[12,'E4',.48],[16,'D4',.68],[20,'G4',.50],[24,'A4',.58],[30,'F4',.44],[32,'D4',.70],[36,'F4',.52],[40,'A4',.61],[44,'C5',.42],[48,'E4',.54],[52,'F4',.48],[56,'A4',.57],[62,'D4',.68]]},
{id:'F-B',m:'FLOW',v:'PULSE',p:1,r:2,b:1,ev:[[0,'D3',.58],[8,'A3',.46],[16,'D3',.55],[24,'C4',.42],[32,'D3',.58],[40,'A3',.44],[48,'D3',.55],[56,'E3',.40]]},
{id:'F-C',m:'FLOW',v:'SPACE',p:1,r:0,b:0,s:3,ev:[[2,'A4',.42],[14,'E5',.30],[22,'F4',.34],[34,'A4',.38],[46,'G4',.28],[58,'D5',.35]]},
{id:'T-A',m:'TENSION',v:'PURE',p:3,r:0,b:0,s:1,ev:[[0,'D4',.64],[5,'F4',.48],[9,'E4',.52],[13,'F4',.40],[16,'D4',.62],[21,'G4',.45],[27,'F4',.46],[31,'E4',.38],[32,'D4',.64],[37,'F4',.45],[42,'E4',.50],[47,'C5',.39],[48,'D4',.58],[53,'E4',.43],[59,'F4',.47],[63,'D4',.66]]},
{id:'T-B',m:'TENSION',v:'PULSE',p:3,r:2,b:1,ev:[[0,'D3',.55],[7,'E3',.36],[11,'F3',.40],[16,'D3',.54],[23,'E3',.34],[27,'G3',.38],[32,'D3',.55],[39,'F3',.38],[43,'E3',.35],[48,'D3',.50],[55,'E3',.35],[61,'F3',.40]]},
{id:'T-C',m:'TENSION',v:'SPACE',p:3,r:0,b:0,s:3,ev:[[3,'E5',.30],[11,'F5',.28],[19,'E5',.27],[29,'C5',.28],[35,'E5',.30],[43,'F5',.26],[51,'E5',.25],[63,'D5',.40]]},
{id:'S-A',m:'SYNC',v:'PURE',p:3,r:1,b:0,s:1,ev:[[2,'D4',.55],[7,'F4',.48],[10,'A4',.52],[15,'E4',.38],[18,'D4',.52],[23,'G4',.45],[27,'A4',.48],[31,'F4',.35],[34,'D4',.55],[39,'F4',.44],[43,'A4',.50],[47,'C5',.35],[50,'E4',.46],[55,'F4',.42],[59,'A4',.46],[63,'D4',.56]]},
{id:'S-B',m:'SYNC',v:'PULSE',p:3,r:3,b:1,ev:[[0,'D3',.52],[6,'A3',.40],[10,'D3',.45],[15,'C4',.34],[16,'D3',.50],[22,'A3',.38],[27,'E3',.36],[31,'C4',.32],[32,'D3',.52],[38,'A3',.40],[42,'D3',.44],[47,'C4',.32],[48,'D3',.48],[54,'A3',.38],[59,'E3',.35],[63,'D3',.46]]},
{id:'S-C',m:'SYNC',v:'SPACE',p:2,r:1,b:0,s:2,ev:[[5,'A4',.34],[13,'D5',.31],[21,'G4',.30],[29,'E5',.27],[37,'A4',.34],[45,'C5',.29],[53,'G4',.28],[61,'D5',.34]]},
{id:'E-A',m:'ECHO',v:'PURE',p:2,r:0,b:0,s:2,ev:[[0,'D4',.58],[8,'A4',.46],[16,'F4',.48],[24,'E4',.38],[32,'D4',.55],[40,'C5',.40],[48,'A4',.46],[56,'E5',.34]]},
{id:'E-B',m:'ECHO',v:'PULSE',p:2,r:1,b:0,s:2,ev:[[0,'D3',.42],[12,'A3',.32],[18,'D3',.40],[30,'C4',.30],[32,'D3',.42],[44,'A3',.31],[50,'E3',.34],[62,'D3',.38]]},
{id:'E-C',m:'ECHO',v:'SPACE',p:2,r:0,b:0,s:3,ev:[[1,'D5',.32],[9,'A4',.28],[17,'F5',.26],[25,'E5',.25],[33,'D5',.30],[41,'C5',.25],[49,'A4',.27],[57,'E5',.26]]}
];
function ac(){return ctx.currentTime}
function impulse(sec=2.4,dec=2.8){const len=ctx.sampleRate*sec,b=ctx.createBuffer(2,len,ctx.sampleRate);for(let c=0;c<2;c++){let d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,dec)}return b}
function setup(){ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=.55; const comp=ctx.createDynamicsCompressor();comp.threshold.value=-12;comp.knee.value=18;comp.ratio.value=4;comp.attack.value=.006;comp.release.value=.18;master.connect(comp).connect(ctx.destination);delay=ctx.createDelay(1);delay.delayTime.value=.29;delayFb=ctx.createGain();delayFb.gain.value=.23;delay.connect(delayFb).connect(delay);delay.connect(master);reverb=ctx.createConvolver();reverb.buffer=impulse();const rg=ctx.createGain();rg.gain.value=.22;reverb.connect(rg).connect(master);noiseBuffer=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);let d=noiseBuffer.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
function ep(freq,t,vel=.5,space=.12){
  // Piano Engine v2: felt/electric-piano hybrid.
  // Short hammer transient + warm fundamental/body + rapidly decaying upper partials.
  const bus=ctx.createGain(), tone=ctx.createBiquadFilter(), body=ctx.createBiquadFilter();
  tone.type='lowpass'; tone.Q.value=.42;
  const brightness=2200+vel*1700;
  tone.frequency.setValueAtTime(brightness,t);
  tone.frequency.exponentialRampToValueAtTime(1050+freq*.55,t+1.65);
  body.type='peaking'; body.frequency.value=Math.min(920,Math.max(300,freq*1.65)); body.Q.value=.75; body.gain.value=2.2;
  bus.gain.setValueAtTime(.0001,t);
  bus.gain.exponentialRampToValueAtTime(Math.max(.014,vel*.19),t+.006);
  bus.gain.exponentialRampToValueAtTime(Math.max(.004,vel*.055),t+.23);
  bus.gain.exponentialRampToValueAtTime(.0001,t+2.25);
  tone.connect(body).connect(bus); bus.connect(master);
  const sg=ctx.createGain(); sg.gain.value=space*.72; bus.connect(sg); sg.connect(delay); sg.connect(reverb);

  // Fundamental and warm body. Slight detune avoids a sterile oscillator character.
  const partials=[
    [1.000,'sine',1.00,2.18,0],
    [2.000,'sine',0.115,.72,1.2],
    [3.006,'sine',0.036,.38,-1.1],
    [4.014,'sine',0.014,.22,2.0]
  ];
  partials.forEach(([mul,type,level,life,det])=>{
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type; o.frequency.value=freq*mul; o.detune.value=det;
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(level,t+.004);
    g.gain.exponentialRampToValueAtTime(.0001,t+life);
    o.connect(g).connect(tone); o.start(t); o.stop(t+life+.03);
  });

  // Felt/hammer contact: deliberately short and quiet, giving a key-strike cue without a synth click.
  const ns=ctx.createBufferSource(), hp=ctx.createBiquadFilter(), lp=ctx.createBiquadFilter(), ng=ctx.createGain();
  ns.buffer=noiseBuffer; hp.type='highpass'; hp.frequency.value=900; lp.type='lowpass'; lp.frequency.value=3600+vel*1500;
  ng.gain.setValueAtTime(.0001,t); ng.gain.linearRampToValueAtTime(.010+vel*.018,t+.002); ng.gain.exponentialRampToValueAtTime(.0001,t+.032);
  ns.connect(hp).connect(lp).connect(ng).connect(bus); ns.start(t); ns.stop(t+.04);

  // Tiny sympathetic resonance above the played note; much lower than v0.2's metallic tine.
  const r=ctx.createOscillator(),rg=ctx.createGain(); r.type='sine'; r.frequency.value=freq*2.002;
  rg.gain.setValueAtTime(.0001,t+.018); rg.gain.exponentialRampToValueAtTime(.018*vel,t+.045); rg.gain.exponentialRampToValueAtTime(.0001,t+.52);
  r.connect(rg).connect(tone); r.start(t+.015); r.stop(t+.56);
}
function bass(freq,t,vel=.5){const o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();o.type='triangle';o.frequency.value=freq;f.type='lowpass';f.frequency.value=520;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vel*.16,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.34);o.connect(f).connect(g).connect(master);o.start(t);o.stop(t+.38)}
function kick(t,amp=.7){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(125,t);o.frequency.exponentialRampToValueAtTime(46,t+.12);g.gain.setValueAtTime(amp*.34,t);g.gain.exponentialRampToValueAtTime(.0001,t+.24);o.connect(g).connect(master);o.start(t);o.stop(t+.26)}
function hat(t,amp=.18){const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=noiseBuffer;f.type='highpass';f.frequency.value=6200;g.gain.setValueAtTime(amp,t);g.gain.exponentialRampToValueAtTime(.0001,t+.045);s.connect(f).connect(g).connect(master);s.start(t);s.stop(t+.05)}
function flash(id,intensity=1,delayMs=0){setTimeout(()=>{const el=pads.get(id);if(!el)return;el.style.setProperty('--pulse',intensity);el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),90+intensity*90)},Math.max(0,delayMs))}
function schedulePhrase(ph,st,t){const ev=ph.ev.filter(e=>e[0]===st);let spatial=ph.s||0;let activeSpace=[...active].map(id=>phrases.find(p=>p.id===id)).filter(Boolean).reduce((a,p)=>a+(p.s||0),0);let spaceGain=spatial?Math.max(.07,.18-(activeSpace*.012)): .05;for(const [,note,v] of ev){if(ph.v==='PULSE')bass(N[note],t,v);else ep(N[note],t,v,spaceGain);flash(ph.id,.7,Math.max(0,(t-ac())*1000))}
if(ph.v==='PULSE'){const heavy=[...active].map(id=>phrases.find(p=>p.id===id)).filter(p=>p&&p.v==='PULSE').sort((a,b)=>b.r-a.r);const owner=heavy[0]?.id===ph.id;const local=st%16;if(owner&&(local===0||local===8||(ph.m==='SYNC'&&local===14)))kick(t,ph.r===3?.82:.65);if(ph.r>=2&&(local%4===2||local===7||local===15))hat(t,ph.r===3?.16:.11);if(ph.r===1&&(local===6||local===14))hat(t,.09);if((owner&&local===0)||(ph.r>=2&&local===2))flash(ph.id,.9,Math.max(0,(t-ac())*1000))}}
function applyPending(){for(const [id,want] of pending){if(want){if(active.size<4)active.add(id)}else active.delete(id);pending.delete(id)}renderState()}
function scheduler(){while(nextStep<ac()+.11){if(step%16===0){applyPending();bar=(Math.floor(step/16)%4)+1;document.getElementById('bar').textContent=bar}for(const id of active){const ph=phrases.find(p=>p.id===id);if(ph)schedulePhrase(ph,step%STEPS,nextStep)}const dur=60/bpm/4;nextStep+=dur;step=(step+1)%STEPS}timer=setTimeout(scheduler,25)}
function toggle(id){const isOn=active.has(id),queued=pending.get(id);const target=queued!==undefined?!queued:!isOn;if(target&&!isOn&&[...active].filter(x=>pending.get(x)!==false).length+[...pending].filter(([x,v])=>v&&!active.has(x)).length>=4){document.getElementById('status').textContent='LIMIT // MAX 4 PHRASES';return}pending.set(id,target);const el=pads.get(id);el.classList.add('armed');document.getElementById('status').textContent=target?'ARMED // NEXT BAR':'STOP ARMED // NEXT BAR'}
function renderState(){for(const [id,el] of pads){el.classList.toggle('live',active.has(id));el.classList.remove('armed')}document.getElementById('activeCount').textContent=active.size;document.getElementById('status').textContent=active.size?'ENGINE // PLAYING':'ENGINE // READY'}
function buildGrid(){const grid=document.getElementById('grid');let slots=Array.from({length:36},(_,i)=>i);for(let i=slots.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[slots[i],slots[j]]=[slots[j],slots[i]]}const chosen=slots.slice(0,12);for(let i=0;i<36;i++){const b=document.createElement('button');b.className='pad dummy';b.type='button';grid.appendChild(b)}phrases.forEach((ph,k)=>{const b=grid.children[chosen[k]];b.className='pad';b.style.setProperty('--c',C[ph.m]);b.innerHTML=`<span class="dot"></span><span class="tag">${ph.m.slice(0,1)}·${ph.v.slice(0,1)}</span>`;b.addEventListener('pointerdown',e=>{e.preventDefault();toggle(ph.id)});pads.set(ph.id,b)})}
document.getElementById('tempo').addEventListener('change',e=>{bpm=+e.target.value;document.getElementById('status').textContent='TEMPO // '+bpm+' BPM'});document.getElementById('initBtn').addEventListener('click',async()=>{setup();await ctx.resume();document.getElementById('overlay').classList.add('hidden');buildGrid();nextStep=ac()+.08;step=0;scheduler();document.getElementById('status').textContent='ENGINE // READY'});
})();
</script></body></html>
