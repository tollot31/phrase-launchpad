<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Parchment Jazz</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#cdbb91;
  font-family:Georgia,"Times New Roman",serif;
}

body{
  touch-action:manipulation;
  user-select:none;
  -webkit-user-select:none;
}

#stage{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(circle at 23% 17%,
      rgba(255,255,235,.26),transparent 31%),
    radial-gradient(circle at 82% 76%,
      rgba(91,63,34,.10),transparent 36%),
    linear-gradient(112deg,
      #d7c69b 0%,
      #cdb98c 47%,
      #d3c092 100%);
}

/* 紙の微細な繊維感 */
#stage::before{
  content:"";
  position:absolute;
  inset:-30px;
  pointer-events:none;
  opacity:.28;
  background-image:
    repeating-linear-gradient(
      4deg,
      rgba(70,48,28,.025) 0px,
      rgba(70,48,28,.025) 1px,
      transparent 1px,
      transparent 5px
    ),
    repeating-linear-gradient(
      94deg,
      rgba(255,255,255,.035) 0px,
      rgba(255,255,255,.035) 1px,
      transparent 1px,
      transparent 7px
    );
  filter:blur(.15px);
}

#stage::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  box-shadow:
    inset 0 0 90px rgba(54,36,19,.18),
    inset 0 0 20px rgba(54,36,19,.10);
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

#title{
  position:absolute;
  top:max(22px,env(safe-area-inset-top));
  left:0;
  width:100%;
  text-align:center;
  color:rgba(47,36,24,.48);
  letter-spacing:.28em;
  font-size:11px;
  pointer-events:none;
  transition:opacity 1.2s ease;
}

#title.playing{
  opacity:.18;
}

#controls{
  position:absolute;
  left:50%;
  bottom:max(18px,calc(env(safe-area-inset-bottom) + 10px));
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:16px;
  padding:8px 11px;
  border-radius:30px;
  background:rgba(218,202,162,.38);
  border:1px solid rgba(61,44,27,.15);
  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);
  box-shadow:0 4px 20px rgba(65,45,26,.07);
  transition:opacity .8s ease;
}

#controls.dim{
  opacity:.42;
}

button{
  appearance:none;
  -webkit-appearance:none;
  border:0;
  background:transparent;
  color:#493925;
  font-family:Georgia,"Times New Roman",serif;
  letter-spacing:.14em;
  font-size:11px;
  height:38px;
  min-width:62px;
  padding:0 13px;
  border-radius:21px;
}

button:active{
  background:rgba(74,54,31,.08);
}

#tempoBox{
  display:flex;
  align-items:center;
  gap:8px;
  color:rgba(62,46,29,.72);
  font-size:10px;
  letter-spacing:.08em;
}

input[type="range"]{
  width:76px;
  accent-color:#66523a;
}

#bpm{
  width:27px;
  text-align:right;
  font-variant-numeric:tabular-nums;
}

#hint{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  color:rgba(57,42,26,.44);
  font-size:11px;
  letter-spacing:.18em;
  pointer-events:none;
  transition:opacity 1.5s ease;
  white-space:nowrap;
}

#hint.hide{
  opacity:0;
}

@media (max-width:500px){
  #controls{ gap:6px; }
  input[type="range"]{ width:62px; }
  button{ min-width:56px; padding:0 9px; }
}
</style>
</head>

<body>
<div id="stage">
  <canvas id="paper"></canvas>

  <div id="title">PARCHMENT JAZZ</div>
  <div id="hint">touch PLAY</div>

  <div id="controls">
    <button id="play">PLAY</button>

    <div id="tempoBox">
      <span>TEMPO</span>
      <input id="tempo" type="range" min="78" max="148" value="108">
      <span id="bpm">108</span>
    </div>
  </div>
</div>

<script>
(() => {
"use strict";

/* ============================================================
   PARCHMENT JAZZ v0.1
   Single HTML / Web Audio / Canvas
   ============================================================ */

const AudioCtx = window.AudioContext || window.webkitAudioContext;

let ctx = null;
let master = null;
let room = null;
let compressor = null;
let noiseBuffer = null;

let running = false;
let sessionToken = 0;

let bpm = 108;
let beat = 60 / bpm;

let energy = 0.30;
let phraseIndex = 0;
let lastType = "statement";
let tonalRoot = 53; // F3
let currentScene = "home";

const $play = document.getElementById("play");
const $tempo = document.getElementById("tempo");
const $bpm = document.getElementById("bpm");
const $hint = document.getElementById("hint");
const $title = document.getElementById("title");
const $controls = document.getElementById("controls");

const canvas = document.getElementById("paper");
const g = canvas.getContext("2d");

let W=0,H=0,DPR=1;

/* ============================================================
   64 PHRASES
   degree:
   0=root, 2=2nd, 3=minor3, 4=major3 etc.
   ============================================================ */

const TYPES = [
  "statement","question","answer","blues",
  "bebop","space","lift","resolve"
];

const phraseSeeds = [

/* 01–08 STATEMENT */
[0,4,7,9,7,4],
[4,7,9,14,11],
[7,4,2,0],
[0,2,3,4,7],
[4,7,14,7],
[7,9,7,4,2],
[0,7,4,11,9],
[4,2,0,7],

/* 09–16 QUESTION */
[0,4,7,11,14],
[4,7,9,11],
[7,9,10,14],
[0,3,5,7,11],
[4,6,7,9,14],
[7,11,14,16],
[2,4,7,9,11],
[0,5,9,11,14],

/* 17–24 ANSWER */
[14,11,7,4,0],
[11,9,7,4],
[9,7,3,0],
[14,10,7,4,0],
[11,7,5,4],
[9,7,4,2,0],
[14,11,9,7,4],
[7,5,4,2,0],

/* 25–32 BLUES */
[0,3,5,6,7,3],
[7,6,5,3,0],
[0,3,5,7,10,7],
[3,5,6,7,10],
[0,3,5,3,0],
[7,10,12,10,7,6,5],
[0,5,3,6,7],
[3,0,3,5,6,7,10],

/* 33–40 BEBOP */
[0,2,4,5,7,8,9,11,12],
[7,6,5,4,3,2,1,0],
[4,7,11,10,9,8,7,4],
[0,4,7,9,10,11,14,12],
[12,11,9,8,7,5,4,2,0],
[4,5,7,8,9,11,12,14],
[7,9,11,12,11,10,9,7,4],
[0,1,2,4,5,6,7,11,12],

/* 41–48 SPACE */
[0],
[4,7],
[7],
[0,9],
[4],
[7,11],
[3,7],
[0,7],

/* 49–56 LIFT */
[0,2,4,7,9,11,14],
[4,5,7,9,11,12,14],
[0,4,7,12,14],
[3,5,7,10,12,15],
[0,2,5,7,9,12],
[4,7,9,11,14,16],
[0,5,7,12,14,17],
[7,9,11,14,16,19],

/* 57–64 RESOLVE */
[14,11,9,7,4,0],
[12,9,7,4,0],
[11,7,5,4,0],
[14,12,10,7,3,0],
[9,7,4,2,0],
[7,5,4,0],
[11,9,7,4,2,0],
[7,4,0]
];

const phrases = phraseSeeds.map((notes,i) => {
  const group = Math.floor(i/8);
  const type = TYPES[group];

  let density = .5;
  let openness = .5;
  let tension = .4;

  if(type==="bebop") density=.95;
  if(type==="space") density=.12;
  if(type==="lift"){ density=.75; tension=.72; }
  if(type==="resolve"){ tension=.15; openness=.15; }
  if(type==="question"){ tension=.67; openness=.88; }
  if(type==="answer"){ tension=.25; openness=.28; }
  if(type==="blues") tension=.48;

  return {
    id:i+1,
    type,
    notes,
    density,
    openness,
    tension,

    line:{
      curvature:
        type==="blues" ? .82 :
        type==="bebop" ? .25 :
        type==="space" ? .70 :
        type==="lift" ? .48 : .56,

      roughness:
        type==="blues" ? .75 :
        type==="bebop" ? .45 : .25,

      pressure:
        type==="lift" ? .82 :
        type==="space" ? .28 : .52,

      fade:
        type==="space" ? 7200 : 9800
    }
  };
});

/* ============================================================
   HARMONIC SCENES
   ============================================================ */

const scenes = {
  home:[
    {root:0, quality:"maj7"},
    {root:9, quality:"min7"},
    {root:2, quality:"min7"},
    {root:7, quality:"dom7"}
  ],

  motion:[
    {root:4, quality:"min7"},
    {root:9, quality:"dom7"},
    {root:2, quality:"min7"},
    {root:7, quality:"dom7"}
  ],

  blues:[
    {root:0, quality:"dom7"},
    {root:5, quality:"dom7"},
    {root:0, quality:"dom7"},
    {root:7, quality:"dom7"}
  ],

  modal:[
    {root:0, quality:"min7"},
    {root:0, quality:"min7"},
    {root:3, quality:"maj7"},
    {root:0, quality:"min7"}
  ],

  release:[
    {root:2, quality:"min7"},
    {root:7, quality:"dom7"},
    {root:0, quality:"maj7"},
    {root:0, quality:"maj7"}
  ]
};

let harmonyStep = 0;

function chooseScene(){
  const r=Math.random();

  if(energy>.72){
    currentScene = r<.42 ? "motion" :
                   r<.72 ? "blues" : "release";
  } else if(energy<.27){
    currentScene = r<.50 ? "modal" : "home";
  } else {
    currentScene =
      ["home","motion","blues","modal","release"]
      [Math.floor(Math.random()*5)];
  }
}

function chordNow(){
  const s=scenes[currentScene];
  return s[harmonyStep % s.length];
}

/* ============================================================
   AUDIO SETUP
   ============================================================ */

function makeNoiseBuffer(){
  const len = ctx.sampleRate * 2;
  const b = ctx.createBuffer(1,len,ctx.sampleRate);
  const d = b.getChannelData(0);

  let last=0;
  for(let i=0;i<len;i++){
    const white=Math.random()*2-1;
    last = last*.72 + white*.28;
    d[i]=last;
  }
  return b;
}

function initAudio(){
  if(ctx) return;

  ctx = new AudioCtx();

  master = ctx.createGain();
  master.gain.value=.58;

  compressor = ctx.createDynamicsCompressor();
  compressor.threshold.value=-15;
  compressor.knee.value=18;
  compressor.ratio.value=3;
  compressor.attack.value=.006;
  compressor.release.value=.22;

  /* 暗めのmaster filter */
  const masterLP = ctx.createBiquadFilter();
  masterLP.type="lowpass";
  masterLP.frequency.value=9000;
  masterLP.Q.value=.25;

  room = ctx.createConvolver();
  room.buffer = createImpulse(1.3,2.5);

  const dry=ctx.createGain();
  const wet=ctx.createGain();

  dry.gain.value=.92;
  wet.gain.value=.13;

  master.connect(dry);
  master.connect(room);
  room.connect(wet);

  dry.connect(masterLP);
  wet.connect(masterLP);
  masterLP.connect(compressor);
  compressor.connect(ctx.destination);

  noiseBuffer=makeNoiseBuffer();
}

function createImpulse(seconds,decay){
  const length=ctx.sampleRate*seconds;
  const impulse=ctx.createBuffer(2,length,ctx.sampleRate);

  for(let c=0;c<2;c++){
    const d=impulse.getChannelData(c);
    for(let i=0;i<length;i++){
      d[i]=(Math.random()*2-1)*
        Math.pow(1-i/length,decay);
    }
  }
  return impulse;
}

function hz(midi){
  return 440*Math.pow(2,(midi-69)/12);
}

function panNode(value){
  if(ctx.createStereoPanner){
    const p=ctx.createStereoPanner();
    p.pan.value=value;
    return p;
  }
  return ctx.createGain();
}

/* ============================================================
   PIANO
   ============================================================ */

function piano(midi,time,dur=.55,vel=.55){
  const out=ctx.createGain();
  const pan=panNode(-.22);

  out.connect(pan);
  pan.connect(master);

  out.gain.setValueAtTime(.0001,time);
  out.gain.exponentialRampToValueAtTime(
    Math.max(.015,vel*.31),time+.007
  );
  out.gain.exponentialRampToValueAtTime(
    .0001,time+dur
  );

  const f=hz(midi);

  const partials=[
    [1,1],
    [2.01,.38],
    [3.02,.18],
    [4.08,.075],
    [5.12,.035]
  ];

  partials.forEach(([mul,a],idx)=>{
    const o=ctx.createOscillator();
    const gg=ctx.createGain();

    o.type=idx===0 ? "triangle":"sine";
    o.frequency.setValueAtTime(f*mul,time);

    /* tiny inharmonicity */
    o.detune.value=(Math.random()-.5)*3;

    gg.gain.value=a;

    o.connect(gg);
    gg.connect(out);

    o.start(time);
    o.stop(time+dur+.05);
  });

  /* hammer transient */
  const n=ctx.createBufferSource();
  n.buffer=noiseBuffer;

  const nf=ctx.createBiquadFilter();
  nf.type="bandpass";
  nf.frequency.value=Math.min(4800,1000+f*3);
  nf.Q.value=.7;

  const ng=ctx.createGain();
  ng.gain.setValueAtTime(vel*.07,time);
  ng.gain.exponentialRampToValueAtTime(.0001,time+.025);

  n.connect(nf);
  nf.connect(ng);
  ng.connect(out);

  n.start(time);
  n.stop(time+.035);
}

/* ============================================================
   UPRIGHT BASS
   ============================================================ */

function bass(midi,time,dur=.40,vel=.55){
  const f=hz(midi);

  const out=ctx.createGain();
  const filter=ctx.createBiquadFilter();
  const pan=panNode(-.02);

  filter.type="lowpass";
  filter.frequency.setValueAtTime(1100,time);
  filter.frequency.exponentialRampToValueAtTime(
    280,time+.20
  );

  out.gain.setValueAtTime(.0001,time);
  out.gain.exponentialRampToValueAtTime(
    vel*.46,time+.012
  );
  out.gain.exponentialRampToValueAtTime(
    .0001,time+dur
  );

  filter.connect(out);
  out.connect(pan);
  pan.connect(master);

  const o1=ctx.createOscillator();
  const o2=ctx.createOscillator();

  o1.type="triangle";
  o2.type="sine";

  o1.frequency.value=f;
  o2.frequency.value=f*2.002;

  const g2=ctx.createGain();
  g2.gain.value=.14;

  o1.connect(filter);
  o2.connect(g2);
  g2.connect(filter);

  o1.start(time);
  o2.start(time);
  o1.stop(time+dur+.04);
  o2.stop(time+dur+.04);

  const pluck=ctx.createBufferSource();
  pluck.buffer=noiseBuffer;

  const pg=ctx.createGain();
  pg.gain.setValueAtTime(.09*vel,time);
  pg.gain.exponentialRampToValueAtTime(.0001,time+.035);

  pluck.connect(pg);
  pg.connect(filter);

  pluck.start(time);
  pluck.stop(time+.04);
}

/* ============================================================
   BREATHY HORN
   ============================================================ */

function horn(midi,time,dur=.35,vel=.5,kind="sax"){
  const f=hz(midi);

  const out=ctx.createGain();
  const filter=ctx.createBiquadFilter();
  const pan=panNode(kind==="sax" ? .20 : .28);

  filter.type="bandpass";
  filter.frequency.value=
    kind==="sax" ? Math.min(2100,f*3.2) : Math.min(2900,f*4);
  filter.Q.value=kind==="sax" ? .75 : 1.15;

  out.gain.setValueAtTime(.0001,time);
  out.gain.linearRampToValueAtTime(vel*.27,time+.045);
  out.gain.setValueAtTime(vel*.25,time+Math.max(.05,dur-.07));
  out.gain.exponentialRampToValueAtTime(.0001,time+dur);

  filter.connect(out);
  out.connect(pan);
  pan.connect(master);

  const waves =
    kind==="sax"
    ? [["sawtooth",1,.38],["sine",2,.19],["sine",3,.08]]
    : [["sawtooth",1,.30],["square",2,.07],["sine",3,.11]];

  waves.forEach(([type,mul,amp])=>{
    const o=ctx.createOscillator();
    const gg=ctx.createGain();

    o.type=type;
    o.frequency.setValueAtTime(f*mul,time);

    o.detune.setValueAtTime(-3+Math.random()*6,time);
    o.detune.linearRampToValueAtTime(
      2+Math.random()*4,time+dur
    );

    gg.gain.value=amp;

    o.connect(gg);
    gg.connect(filter);

    o.start(time);
    o.stop(time+dur+.03);
  });

  /* breath */
  const n=ctx.createBufferSource();
  n.buffer=noiseBuffer;

  const bp=ctx.createBiquadFilter();
  bp.type="bandpass";
  bp.frequency.value=kind==="sax" ? 1700:2400;
  bp.Q.value=.7;

  const ng=ctx.createGain();
  ng.gain.setValueAtTime(.0001,time);
  ng.gain.linearRampToValueAtTime(
    kind==="sax" ? .035:.018,time+.04
  );
  ng.gain.exponentialRampToValueAtTime(
    .0001,time+dur
  );

  n.connect(bp);
  bp.connect(ng);
  ng.connect(out);

  n.start(time);
  n.stop(time+dur);
}

/* ============================================================
   DRUMS
   ============================================================ */

function noiseHit(time,dur,level,freq,q=.8,panVal=.08){
  const n=ctx.createBufferSource();
  n.buffer=noiseBuffer;

  const f=ctx.createBiquadFilter();
  f.type="bandpass";
  f.frequency.value=freq;
  f.Q.value=q;

  const gg=ctx.createGain();
  const pan=panNode(panVal);

  gg.gain.setValueAtTime(level,time);
  gg.gain.exponentialRampToValueAtTime(.0001,time+dur);

  n.connect(f);
  f.connect(gg);
  gg.connect(pan);
  pan.connect(master);

  n.start(time);
  n.stop(time+dur+.02);
}

function ride(time,strong=.6){
  /* metallic partial cluster */
  [1,1.34,1.78,2.31].forEach((m,i)=>{
    const o=ctx.createOscillator();
    const gg=ctx.createGain();
    const pan=panNode(.08);

    o.type="square";
    o.frequency.value=620*m;

    gg.gain.setValueAtTime(
      strong*(i===0?.018:.007),time
    );
    gg.gain.exponentialRampToValueAtTime(
      .0001,time+.20+(i*.025)
    );

    o.connect(gg);
    gg.connect(pan);
    pan.connect(master);

    o.start(time);
    o.stop(time+.28);
  });

  noiseHit(time,.12,strong*.017,5400,.6,.08);
}

function hihat(time,level=.025){
  noiseHit(time,.055,level,7200,.8,.12);
}

function snare(time,level=.04){
  noiseHit(time,.10,level,1800,.65,.12);
}

function kick(time,level=.07){
  const o=ctx.createOscillator();
  const gg=ctx.createGain();
  const pan=panNode(.02);

  o.type="sine";
  o.frequency.setValueAtTime(90,time);
  o.frequency.exponentialRampToValueAtTime(48,time+.07);

  gg.gain.setValueAtTime(level,time);
  gg.gain.exponentialRampToValueAtTime(.0001,time+.11);

  o.connect(gg);
  gg.connect(pan);
  pan.connect(master);

  o.start(time);
  o.stop(time+.13);
}

/* ============================================================
   COMPING
   ============================================================ */

const QUALITY = {
  maj7:[0,4,7,11],
  min7:[0,3,7,10],
  dom7:[0,4,7,10]
};

function compChord(chord,time,velocity=.28){
  const notes=QUALITY[chord.quality];

  /* rootless-ish voicing */
  [notes[1],notes[3],notes[2]].forEach((n,i)=>{
    piano(
      tonalRoot+12+chord.root+n,
      time+i*.012,
      .42+Math.random()*.16,
      velocity*(.85+Math.random()*.18)
    );
  });
}

/* ============================================================
   PHRASE SELECTION
   ============================================================ */

function typeWeight(type){
  let w=1;

  if(lastType==="question" && type==="answer") w*=4.0;
  if(lastType==="question" && type==="space") w*=2.0;
  if(lastType==="lift" && type==="resolve") w*=3.0;
  if(lastType==="bebop" && type==="space") w*=2.2;
  if(lastType==="resolve" && type==="statement") w*=2.5;

  if(energy>.68){
    if(type==="lift" || type==="bebop") w*=2.0;
    if(type==="space") w*=.6;
  }

  if(energy<.30){
    if(type==="space" || type==="statement") w*=2.0;
    if(type==="bebop") w*=.45;
  }

  return w;
}

function choosePhrase(){
  const candidates=phrases.filter(
    p=>p.id!==phraseIndex
  );

  const weights=candidates.map(p=>{
    let w=typeWeight(p.type);

    /* excessive tension avoidance */
    if(energy<.35 && p.tension>.65) w*=.65;

    return w;
  });

  const total=weights.reduce((a,b)=>a+b,0);
  let r=Math.random()*total;

  for(let i=0;i<candidates.length;i++){
    r-=weights[i];
    if(r<=0){
      phraseIndex=candidates[i].id;
      lastType=candidates[i].type;
      return candidates[i];
    }
  }

  return candidates[0];
}

/* ============================================================
   RHYTHM GENERATION
   ============================================================ */

function phraseRhythm(p){
  const n=p.notes.length;

  if(p.type==="space"){
    return Array.from({length:n},(_,i)=>i*1.7);
  }

  if(p.type==="bebop"){
    return Array.from({length:n},(_,i)=>{
      const pair=Math.floor(i/2);
      return pair + (i%2 ? .66 : 0);
    });
  }

  if(p.type==="lift"){
    return Array.from({length:n},(_,i)=>i*.55);
  }

  const arr=[];
  let pos=0;

  for(let i=0;i<n;i++){
    arr.push(pos);

    const options=
      p.type==="blues"
      ? [.66,1,.66,1.33]
      : [.66,1,1,.66,1.33];

    pos+=options[Math.floor(Math.random()*options.length)];
  }

  return arr;
}

/* ============================================================
   SESSION PLAYBACK
   ============================================================ */

function scheduleRhythmSection(start,bars,chord){
  const totalBeats=bars*4;

  for(let b=0;b<totalBeats;b++){
    const t=start+b*beat;

    /* walking bass */
    const nextChord=
      scenes[currentScene][
        (harmonyStep+1)%scenes[currentScene].length
      ];

    let degree;

    if(b%4===0) degree=0;
    else if(b%4===1) degree=Math.random()<.5 ? 7:4;
    else if(b%4===2) degree=Math.random()<.5 ? 4:10;
    else {
      const target=nextChord.root;
      degree=target+(Math.random()<.5 ? -1:1);
    }

    if(Math.random()>.07){
      bass(
        tonalRoot-12+chord.root+degree,
        t+(Math.random()-.5)*.012,
        beat*.68,
        .43+Math.random()*.14
      );
    }

    /* ride */
    if(Math.random() < .78 + energy*.15){
      ride(t,.45+energy*.22);
    }

    /* swing skip note */
    if(Math.random() < .60 + energy*.18){
      ride(t+beat*.66,.27+energy*.13);
    }

    /* hi-hat on 2 & 4 */
    if(b%4===1 || b%4===3){
      hihat(t,.017+energy*.012);
    }

    if(Math.random()<.05+energy*.09){
      snare(t+beat*.66,.018+energy*.025);
    }

    if(Math.random()<.035+energy*.04){
      kick(t,.035+energy*.025);
    }
  }
}

function schedulePhrase(p,start,chord){
  const rhythm=phraseRhythm(p);

  let instrument;

  const r=Math.random();

  if(p.type==="space"){
    instrument=r<.5 ? "trumpet":"piano";
  } else if(p.type==="bebop"){
    instrument=r<.60 ? "sax":"piano";
  } else if(p.type==="blues"){
    instrument=r<.62 ? "sax":"piano";
  } else {
    instrument=
      r<.40 ? "piano" :
      r<.78 ? "sax":"trumpet";
  }

  p.notes.forEach((degree,i)=>{
    /* occasional omission */
    if(
      i>0 &&
      i<p.notes.length-1 &&
      Math.random()<.045
    ) return;

    const t=start+rhythm[i]*beat;

    const midi=
      tonalRoot+12+
      chord.root+
      degree+
      (Math.random()<.06 ? 12:0);

    let dur=beat*.52;

    if(p.type==="space") dur=beat*(1.05+Math.random()*.65);
    if(p.type==="bebop") dur=beat*.32;
    if(p.type==="resolve" && i===p.notes.length-1)
      dur=beat*1.25;

    const vel=
      .42+
      Math.random()*.18+
      (p.type==="lift" ? .10:0);

    if(instrument==="piano")
      piano(midi,t,dur,vel);
    else
      horn(midi,t,dur,vel,instrument);

    addInkEvent(p,degree,i,p.notes.length,t-start);
  });

  /* sparse comping while horn leads */
  if(instrument!=="piano"){
    if(Math.random()<.78)
      compChord(chord,start+beat*.15,.22);

    if(Math.random()<.42)
      compChord(chord,start+beat*2.45,.17);
  }
}

async function sessionLoop(token){
  if(!running || token!==sessionToken) return;

  beat=60/bpm;

  /* energy breath */
  energy += (Math.random()-.46)*.16;
  energy=Math.max(.12,Math.min(.90,energy));

  if(Math.random()<.23){
    chooseScene();
    harmonyStep=0;
  }

  const chord=chordNow();
  const p=choosePhrase();

  const start=ctx.currentTime+.10;

  let bars=
    p.type==="space" ? 2 :
    p.type==="bebop" ? 2 :
    Math.random()<.32 ? 2:1;

  scheduleRhythmSection(start,bars,chord);
  schedulePhrase(p,start,chord);

  harmonyStep++;

  const duration=bars*4*beat;

  /* occasional silence/breath between phrases */
  const gap=
    p.type==="space"
    ? beat*.45
    : beat*(.06+Math.random()*.22);

  await sleep((duration+gap)*1000);

  if(running && token===sessionToken)
    sessionLoop(token);
}

function sleep(ms){
  return new Promise(r=>setTimeout(r,ms));
}

/* ============================================================
   CANVAS / INK
   ============================================================ */

let ink=[];
let visualClock=performance.now();

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth;
  H=innerHeight;

  canvas.width=W*DPR;
  canvas.height=H*DPR;
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  g.setTransform(DPR,0,0,DPR,0,0);
}

window.addEventListener("resize",resize);
resize();

function addInkEvent(p,degree,index,count,relativeTime){
  const marginX=W*.10;
  const marginY=H*.15;

  const usableW=W-marginX*2;
  const usableH=H-marginY*2;

  const pitchNorm=Math.max(0,Math.min(1,(degree+5)/25));

  const baseY=
    H-marginY-
    pitchNorm*usableH;

  const startX=
    marginX+
    Math.random()*usableW*.50;

  const direction=
    p.type==="lift" ? -1 :
    p.type==="resolve" ? .65 :
    Math.random()<.5 ? -1:1;

  const length=
    p.type==="space"
    ? W*(.12+Math.random()*.18)
    : W*(.055+Math.random()*.12);

  ink.push({
    born:performance.now()+relativeTime*1000,
    life:p.line.fade*(.85+Math.random()*.30),

    x:startX,
    y:baseY+(Math.random()-.5)*28,

    len:length,
    rise:direction*(18+Math.random()*75),

    curvature:p.line.curvature,
    rough:p.line.roughness,
    pressure:p.line.pressure,

    seed:Math.random()*1000,

    progress:0,
    speed:
      p.type==="bebop" ? .010 :
      p.type==="space" ? .0035 :
      .006,

    index,
    count
  });
}

function drawInkStroke(s,now){
  if(now<s.born) return true;

  const age=now-s.born;

  if(age>s.life) return false;

  s.progress=Math.min(
    1,
    s.progress+s.speed*(16.67/Math.max(1,now-visualClock+16.67))
  );

  const fadeStart=.42;
  const ageNorm=age/s.life;

  let alpha=.42;

  if(ageNorm>fadeStart){
    alpha*=1-(ageNorm-fadeStart)/(1-fadeStart);
  }

  const segments=22;
  const maxSeg=Math.max(2,Math.floor(segments*s.progress));

  g.save();
  g.lineCap="round";
  g.lineJoin="round";

  g.strokeStyle=`rgba(53,42,30,${alpha})`;
  g.lineWidth=.7+s.pressure*1.55;

  g.beginPath();

  for(let i=0;i<=maxSeg;i++){
    const t=i/segments;

    const x=s.x+s.len*t;

    const curve=
      Math.sin(t*Math.PI)*
      s.rise*
      s.curvature;

    const slope=s.rise*t*.35;

    const jitter=
      Math.sin((t*19)+s.seed)*
      s.rough*2.2;

    const y=s.y+curve+slope+jitter;

    if(i===0) g.moveTo(x,y);
    else g.lineTo(x,y);
  }

  g.stroke();

  /* ink variation / second hairline */
  if(s.rough>.35){
    g.strokeStyle=`rgba(68,50,32,${alpha*.24})`;
    g.lineWidth=.45;
    g.translate(0,1.3);
    g.stroke();
  }

  g.restore();

  return true;
}

function paperGrain(){
  /* very sparse animated pigment */
  for(let i=0;i<12;i++){
    const a=Math.random()*.018;
    g.fillStyle=`rgba(55,40,24,${a})`;
    g.fillRect(
      Math.random()*W,
      Math.random()*H,
      Math.random()*1.4+.2,
      Math.random()*1.4+.2
    );
  }
}

function render(now){
  g.clearRect(0,0,W,H);

  ink=ink.filter(s=>drawInkStroke(s,now));

  paperGrain();

  visualClock=now;
  requestAnimationFrame(render);
}

requestAnimationFrame(render);

/* ============================================================
   UI
   ============================================================ */

async function togglePlay(){
  initAudio();

  if(ctx.state==="suspended" || ctx.state==="interrupted"){
    try{ await ctx.resume(); }catch(e){}
  }

  running=!running;

  if(running){
    sessionToken++;
    $play.textContent="PAUSE";
    $hint.classList.add("hide");
    $title.classList.add("playing");
    $controls.classList.add("dim");

    chooseScene();
    sessionLoop(sessionToken);
  }else{
    sessionToken++;
    $play.textContent="PLAY";
    $controls.classList.remove("dim");
    $title.classList.remove("playing");
  }
}

$play.addEventListener("click",togglePlay);

$tempo.addEventListener("input",()=>{
  bpm=Number($tempo.value);
  $bpm.textContent=bpm;
});

/* Safari復帰 */
document.addEventListener("visibilitychange",async()=>{
  if(
    document.visibilityState==="visible" &&
    running &&
    ctx &&
    ctx.state!=="running"
  ){
    try{ await ctx.resume(); }catch(e){}
  }
});

/* controls reveal */
let dimTimer=null;

function reveal(){
  $controls.classList.remove("dim");

  clearTimeout(dimTimer);

  if(running){
    dimTimer=setTimeout(()=>{
      $controls.classList.add("dim");
    },1800);
  }
}

document.addEventListener("pointerdown",reveal,{passive:true});

})();
</script>
